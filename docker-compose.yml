services:
  pocketbase:
    build: .
    # 如果不想每次都构建，也可以使用预先构建好的镜像（需要你自己推送）
    # image: your-registry/pocketbase:latest
    ports:
      - "8080:8080"
    volumes:
      # 持久化 PocketBase 数据（pb_data 目录）
      - ../pb_data:/pb/pb_data
      # 可选：挂载本地迁移文件（取消下面两行的注释，并确保本地有这些目录）
      # - ./pb_migrations:/pb/pb_migrations
      # - ./pb_hooks:/pb/pb_hooks
    restart: unless-stopped
    networks:
      dokploy-network:
        aliases:
          - showcase-vault-pocketbase-internal
networks:
  dokploy-network:
    external: true
